name: Deploy to TestFlight & Google Play

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"

      - name: Install dependencies
        run: flutter pub get
        working-directory: lawding_flutter

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: lawding_flutter/ios

      - name: Run Fastlane iOS beta
        working-directory: lawding_flutter/ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
        run: bundle exec fastlane beta

  deploy_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"

      - name: Install dependencies
        run: flutter pub get
        working-directory: lawding_flutter

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: lawding_flutter/android

      - name: Setup keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > lawding_flutter/android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > lawding_flutter/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> lawding_flutter/android/key.properties
          echo "keyAlias=upload" >> lawding_flutter/android/key.properties
          echo "storeFile=/home/runner/work/Lawding_Flutter/Lawding_Flutter/lawding_flutter/android/app/upload-keystore.jks" >> lawding_flutter/android/key.properties

      - name: Create Google Play key
        run: |
          echo '${{ secrets.GOOGLE_PLAY_KEY_JSON }}' > lawding_flutter/android/fastlane/google-play-key.json

      - name: Run Fastlane Android beta
        working-directory: lawding_flutter/android
        run: bundle exec fastlane beta
